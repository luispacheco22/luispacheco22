<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">luispacheco22 — Building useful software</title>
  <desc id="desc">A dark gradient banner about building software across AI, security, and product.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#0d1729" />
      <stop offset="1" stop-color="#15102a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d7ff" />
      <stop offset="0.55" stop-color="#7b8cff" />
      <stop offset="1" stop-color="#bf73ff" />
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#18c8ff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#18c8ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#9a5cff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#9a5cff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b9d9ff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)" />
  <rect width="1200" height="320" rx="28" fill="url(#grid)" />
  <circle cx="1040" cy="36" r="260" fill="url(#violetGlow)" />
  <circle cx="80" cy="330" r="260" fill="url(#cyanGlow)" />

  <path d="M760 268 C850 205 914 225 972 150 C1019 90 1078 84 1150 42" fill="none" stroke="url(#accent)" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="972" cy="150" r="5" fill="#7b8cff" />
  <circle cx="972" cy="150" r="18" fill="#7b8cff" opacity="0.16" filter="url(#softGlow)" />

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <circle cx="78" cy="66" r="5" fill="#39d7ff" />
    <text x="96" y="73" fill="#9fb2ca" font-size="20" letter-spacing="1.5">LUISPACHECO22 / GITHUB</text>

    <text x="72" y="160" fill="#f5f8ff" font-size="46" font-weight="700" letter-spacing="0.5">BUILDING USEFUL SOFTWARE</text>
    <rect x="72" y="184" width="670" height="3" rx="1.5" fill="url(#accent)" />
    <text x="72" y="226" fill="#c9d6e8" font-size="24" letter-spacing="4">AI · SECURITY · PRODUCT</text>
    <text x="72" y="278" fill="#6fe2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">&gt; ship · learn · improve_</text>
  </g>
</svg>
